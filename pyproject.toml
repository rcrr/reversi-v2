[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "reversi"
version = "0.1.0"
description = "Reversi engine — modernized from rcrr/reversi"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2",
    "numba>=0.60",
    "lz4",
    "psycopg2",
    "pandas",
    "python-dotenv",
    "json5",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
